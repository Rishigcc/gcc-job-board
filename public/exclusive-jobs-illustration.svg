<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 54 610 366" width="610" height="366" role="img" aria-label="A laptop showing a list of job postings, with search and bookmark controls">
  <defs>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screenSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#C7DDFD"/>
    </linearGradient>
    <linearGradient id="barMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A7F3E4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A5B" flood-opacity="0.16"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2A5B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- laptop -->
  <g filter="url(#soft)">
    <rect x="196" y="112" width="400" height="272" rx="20" fill="#102A52"/>
    <rect x="212" y="128" width="368" height="228" rx="10" fill="url(#screenSheen)"/>
  </g>

  <!-- job rows -->
  <g>
    <!-- row 1 -->
    <rect x="234" y="152" width="34" height="34" rx="9" fill="#2563EB"/>
    <g fill="#FFFFFF">
      <rect x="243" y="164" width="16" height="12" rx="2.5"/>
      <rect x="247.5" y="160" width="7" height="4" rx="1.4"/>
    </g>
    <rect x="282" y="156" width="196" height="9" rx="4.5" fill="url(#barBlue)"/>
    <rect x="282" y="173" width="104" height="9" rx="4.5" fill="url(#barMint)"/>

    <!-- row 2 -->
    <rect x="234" y="214" width="34" height="34" rx="9" fill="#2563EB"/>
    <g fill="#FFFFFF">
      <rect x="243" y="226" width="16" height="12" rx="2.5"/>
      <rect x="247.5" y="222" width="7" height="4" rx="1.4"/>
    </g>
    <rect x="282" y="218" width="160" height="9" rx="4.5" fill="url(#barBlue)"/>
    <rect x="282" y="235" width="128" height="9" rx="4.5" fill="url(#barMint)"/>

    <!-- row 3 -->
    <rect x="234" y="276" width="34" height="34" rx="9" fill="#2563EB"/>
    <g fill="#FFFFFF">
      <rect x="243" y="288" width="16" height="12" rx="2.5"/>
      <rect x="247.5" y="284" width="7" height="4" rx="1.4"/>
    </g>
    <rect x="282" y="280" width="212" height="9" rx="4.5" fill="url(#barBlue)"/>
    <rect x="282" y="297" width="88" height="9" rx="4.5" fill="url(#barMint)"/>
  </g>

  <!-- laptop base -->
  <rect x="150" y="386" width="492" height="20" rx="10" fill="#CFE0FA"/>
  <rect x="352" y="390" width="88" height="7" rx="3.5" fill="#AFC9F2"/>

  <!-- search tile -->
  <g filter="url(#softer)">
    <rect x="138" y="150" width="88" height="88" rx="24" fill="url(#tileBlue)"/>
    <circle cx="176" cy="188" r="17" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="189" y1="201" x2="200" y2="212" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- bookmark tile -->
  <g filter="url(#softer)">
    <rect x="566" y="226" width="82" height="82" rx="22" fill="#FFFFFF"/>
    <path d="M596 250h22a4 4 0 0 1 4 4v34l-15-11-15 11v-34a4 4 0 0 1 4-4z" fill="#1D4ED8"/>
  </g>

  <!-- cursor -->
  <g filter="url(#softer)">
    <path d="M486 262l8 54 11-19 20 5-39-40z" fill="#FFFFFF" stroke="#102A52" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g stroke="#2563EB" stroke-width="5" stroke-linecap="round">
    <line x1="534" y1="272" x2="550" y2="264"/>
    <line x1="539" y1="294" x2="557" y2="296"/>
    <line x1="528" y1="314" x2="537" y2="330"/>
  </g>

  <!-- sparks -->
  <g stroke="#FACC15" stroke-width="9" stroke-linecap="round">
    <line x1="654" y1="96" x2="648" y2="70"/>
    <line x1="684" y1="106" x2="702" y2="88"/>
    <line x1="694" y1="136" x2="720" y2="134"/>
  </g>
</svg>
